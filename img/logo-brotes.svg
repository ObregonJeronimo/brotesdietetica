<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Brotes Dietética">
  <title>Brotes Dietética</title>
  <defs>
    <!-- Letras geométricas construidas como trazos: se ven igual en todos los dispositivos
         (no dependen de que la fuente esté instalada). Caja de glifo: 96 x 132. -->
    <g id="gB" fill="none">
      <path d="M12.5,12.5 L12.5,119.5"/>
      <path d="M12.5,12.5 L50,12.5 A26.75,26.75 0 0 1 50,66 L12.5,66"/>
      <path d="M12.5,66 L55,66 A26.75,26.75 0 0 1 55,119.5 L12.5,119.5"/>
    </g>
    <g id="gR" fill="none">
      <path d="M12.5,12.5 L12.5,119.5"/>
      <path d="M12.5,12.5 L50,12.5 A26.75,26.75 0 0 1 50,66 L12.5,66"/>
      <path d="M46,64 L84,119.5"/>
    </g>
    <g id="gO" fill="none">
      <path d="M48,12.5 A35.5,53.5 0 0 1 48,119.5 A35.5,53.5 0 0 1 48,12.5"/>
    </g>
    <g id="gT" fill="none">
      <path d="M4,12.5 L92,12.5"/>
      <path d="M48,12.5 L48,119.5"/>
    </g>
    <g id="gE" fill="none">
      <path d="M12.5,12.5 L12.5,119.5"/>
      <path d="M12.5,12.5 L84,12.5"/>
      <path d="M12.5,66 L74,66"/>
      <path d="M12.5,119.5 L84,119.5"/>
    </g>
    <g id="gS" fill="none">
      <path d="M82,32 C82,18 66,12.5 47,12.5 C27,12.5 13,21 13,39 C13,57 27,64 48,66 C69,68 83,74 83,92 C83,110 69,119.5 48,119.5 C29,119.5 14,113 14,99"/>
    </g>
    <g id="gD" fill="none">
      <path d="M12.5,12.5 L12.5,119.5"/>
      <path d="M12.5,12.5 L46,12.5 A43,53.5 0 0 1 46,119.5 L12.5,119.5"/>
    </g>
    <g id="gI" fill="none">
      <path d="M48,12.5 L48,119.5"/>
    </g>
    <g id="gC" fill="none">
      <path d="M84,34 C76,20 63,12.5 48,12.5 C28,12.5 13,35 13,66 C13,97 28,119.5 48,119.5 C63,119.5 76,112 84,98"/>
    </g>
    <g id="gA" fill="none">
      <path d="M6,119.5 L48,12.5 L90,119.5"/>
      <path d="M24,84 L72,84"/>
    </g>
    <g id="gDash" fill="none">
      <path d="M20,66 L76,66"/>
    </g>

    <!-- Palabra BROTES: 6 glifos, avance 110, ancho total 646 -->
    <g id="wordBrotes" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <use href="#gB" x="0"/>
      <use href="#gR" x="110"/>
      <use href="#gO" x="220"/>
      <use href="#gT" x="330"/>
      <use href="#gE" x="440"/>
      <use href="#gS" x="550"/>
    </g>

    <!-- Subtitulo - D I E T E T I C A - : 11 elementos, avance 196, ancho total 2056 -->
    <g id="wordDietetica" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <use href="#gDash" x="0"/>
      <use href="#gD" x="196"/>
      <use href="#gI" x="392"/>
      <use href="#gE" x="588"/>
      <use href="#gT" x="784"/>
      <use href="#gE" x="980"/>
      <use href="#gT" x="1176"/>
      <use href="#gI" x="1372"/>
      <use href="#gC" x="1568"/>
      <use href="#gA" x="1764"/>
      <use href="#gDash" x="1960"/>
    </g>

    <clipPath id="discClip">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
  </defs>

  <!-- Aro exterior crema + filete verde -->
  <circle cx="256" cy="256" r="254" fill="#F5EEDA"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#1E3E2C" stroke-width="4"/>

  <g clip-path="url(#discClip)">
    <!-- Fondo amarillo -->
    <rect x="0" y="0" width="512" height="512" fill="#EDB833"/>

    <!-- Raices del brote (por detras del texto, sin llegar al subtitulo) -->
    <g fill="none" stroke="#14251A" stroke-width="2.4" stroke-linecap="round">
      <path d="M361,272 C361,284 358,293 353,300"/>
      <path d="M361,273 C365,285 370,293 378,298"/>
      <path d="M361,275 C353,284 344,290 334,293"/>
      <path d="M361,275 C370,283 380,288 390,290"/>
      <path d="M356,288 C352,293 347,296 342,298"/>
      <path d="M367,287 C371,292 376,295 381,296"/>
    </g>

    <!-- Tallo y hojas del brote -->
    <g>
      <path d="M361,196 C358,172 358,146 361,122" fill="none" stroke="#14251A" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M360,138 C377,116 404,110 419,116 C412,140 385,150 359,146 Z" fill="#14251A"/>
      <path d="M361,148 C345,131 327,124 313,127 C319,148 338,158 360,156 Z" fill="#14251A"/>
    </g>

    <!-- BROTES: copia crema desplazada (efecto tipografia impresa) + verde encima -->
    <g transform="translate(56,196) scale(0.6347)">
      <use href="#wordBrotes" stroke="#F7F0DC" stroke-width="25"/>
    </g>
    <g transform="translate(51,190) scale(0.6347)">
      <use href="#wordBrotes" stroke="#1E3E2C" stroke-width="25"/>
    </g>

    <!-- - D I E T E T I C A - -->
    <g transform="translate(50.4,313.6) scale(0.2)">
      <use href="#wordDietetica" stroke="#26261F" stroke-width="20"/>
    </g>

    <!-- Filete crema separador -->
    <rect x="0" y="358" width="512" height="7" fill="#F5EEDA"/>

    <!-- Toldo carbon con borde inferior festoneado -->
    <path d="M0,365 L0,432
             a34,30 0 0 1 68,0 a34,30 0 0 1 68,0 a34,30 0 0 1 68,0 a34,30 0 0 1 68,0
             a34,30 0 0 1 68,0 a34,30 0 0 1 68,0 a34,30 0 0 1 68,0 a34,30 0 0 1 68,0
             L544,365 Z" fill="#33332E"/>
  </g>
</svg>
