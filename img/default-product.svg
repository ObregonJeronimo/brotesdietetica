<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Producto sin imagen">
  <title>Producto sin imagen</title>
  <!-- Placeholder para productos que todavia no tienen foto cargada.
       Neutro a proposito: no compite con las fotos reales del catalogo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f6f2"/>
      <stop offset="100%" stop-color="#dfe0d2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="385" r="215" fill="#3d402f" fill-opacity="0.05"/>
  <circle cx="400" cy="385" r="215" fill="none" stroke="#3d402f" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Brote -->
  <g transform="translate(400,470) scale(2.0)" opacity="0.30">
    <path d="M0,60 C-6,20 -6,-20 0,-60" fill="none" stroke="#3d402f" stroke-width="11" stroke-linecap="round"/>
    <path d="M-3,-44 C18,-76 60,-84 82,-76 C71,-30 28,-16 -6,-24 Z" fill="#3d402f"/>
    <path d="M0,-22 C-22,-58 -58,-70 -80,-64 C-72,-24 -34,-6 -2,-10 Z" fill="#3d402f"/>
    <g fill="none" stroke="#3d402f" stroke-width="6" stroke-linecap="round">
      <path d="M0,52 C-12,66 -28,74 -44,78"/>
      <path d="M0,52 C12,66 28,74 44,78"/>
      <path d="M0,54 L0,84"/>
    </g>
  </g>

  <text x="400" y="690" text-anchor="middle"
        font-family="'Montserrat', -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="34" font-weight="600" fill="#3d402f" fill-opacity="0.34"
        letter-spacing="2">SIN IMAGEN</text>
</svg>
